<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spinx — Mobile Device Preview</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #090d16;
            --bg-card: #0f172a;
            --border-color: rgba(255, 255, 255, 0.08);
            --primary: #E11D63;
            --primary-glow: rgba(225, 29, 99, 0.3);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-base);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(225, 29, 99, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 85% 85%, rgba(14, 165, 233, 0.05) 0%, transparent 40%);
        }

        header {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            padding: 10px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            z-index: 50;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-badge {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            background: linear-gradient(135deg, #E11D63, #8B5CF6);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 15px;
            color: #fff;
            box-shadow: 0 0 16px var(--primary-glow);
        }

        .brand-title {
            font-size: 14px;
            font-weight: 700;
            letter-spacing: -0.01em;
        }

        .brand-subtitle {
            font-size: 10px;
            color: var(--text-muted);
            font-weight: 500;
        }

        .controls {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .control-group {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 2px;
        }

        .select-input, .text-input {
            background: transparent;
            border: none;
            color: var(--text-main);
            padding: 6px 10px;
            font-size: 12px;
            font-family: inherit;
            outline: none;
            cursor: pointer;
        }

        .select-input option {
            background: #0f172a;
            color: #fff;
        }

        .btn-icon {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 6px 9px;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s ease;
        }

        .btn-icon:hover {
            color: var(--text-main);
            background: rgba(255, 255, 255, 0.08);
        }

        .btn-icon.active {
            color: #fff;
            background: var(--primary);
        }

        .url-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 4px 10px;
            min-width: 260px;
            max-width: 380px;
            flex: 1;
        }

        .url-bar input {
            background: transparent;
            border: none;
            color: var(--text-main);
            font-size: 12px;
            font-family: 'JetBrains Mono', monospace;
            width: 100%;
            outline: none;
        }

        .workspace {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: auto;
            padding: 30px;
        }

        /* Device Mockup Shell */
        .device-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            transform-origin: center center;
        }

        .device-container {
            position: relative;
            box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.1);
            background: #0f121a;
            border: 3px solid #282f3f;
            border-radius: 44px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .device-screen {
            border-radius: 34px;
            overflow: hidden;
            background: #000;
            position: relative;
            flex: 1;
            width: 100%;
            height: 100%;
        }

        .device-notch {
            position: absolute;
            top: 8px;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            height: 24px;
            background: #000;
            border-radius: 20px;
            z-index: 20;
            pointer-events: none;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: #0A0A0C;
        }

        .res-label {
            position: fixed;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 11px;
            font-family: 'JetBrains Mono', monospace;
            color: var(--text-muted);
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(8px);
            border: 1px solid var(--border-color);
            padding: 5px 12px;
            border-radius: 12px;
            pointer-events: none;
            z-index: 40;
        }

        @media (max-width: 640px) {
            header {
                padding: 8px 12px;
            }
            .brand-subtitle {
                display: none;
            }
            .url-bar {
                min-width: 100%;
                order: 3;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="brand">
            <div class="logo-badge">S</div>
            <div>
                <div class="brand-title">Spinx Mobile Preview</div>
                <div class="brand-subtitle">Interactive Multi-Device Container</div>
            </div>
        </div>

        <div class="controls">
            <div class="url-bar">
                <span style="color: #10b981; font-size: 8px;">●</span>
                <input type="text" id="targetUrl" placeholder="http://localhost:8080">
            </div>

            <div class="control-group">
                <select id="deviceSelect" class="select-input">
                    <option value="393x852" data-name="iPhone 15 Pro">iPhone 15 Pro (393 × 852)</option>
                    <option value="375x667" data-name="iPhone SE">iPhone SE (375 × 667)</option>
                    <option value="412x915" data-name="Pixel 8">Pixel 8 (412 × 915)</option>
                    <option value="360x780" data-name="Galaxy S24">Galaxy S24 (360 × 780)</option>
                    <option value="768x1024" data-name="iPad Mini">iPad Mini (768 × 1024)</option>
                    <option value="1280x800" data-name="Desktop">Desktop (1280 × 800)</option>
                </select>
            </div>

            <div class="control-group">
                <select id="zoomSelect" class="select-input" title="Scale / Zoom">
                    <option value="auto">Auto Fit</option>
                    <option value="1">100%</option>
                    <option value="0.85">85%</option>
                    <option value="0.75">75%</option>
                    <option value="0.5">50%</option>
                </select>
            </div>

            <div class="control-group">
                <button id="rotateBtn" class="btn-icon" title="Rotate orientation">
                    <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                    </svg>
                </button>
            </div>

            <div class="control-group">
                <button id="reloadBtn" class="btn-icon" title="Reload iframe">
                    <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                        <path d="M9 10a1 1 0 011-1h4a1 1 0 011 1v4a1 1 0 01-1 1h-4a1 1 0 01-1-1v-4z"></path>
                    </svg>
                </button>
                <button id="openTabBtn" class="btn-icon" title="Open in new browser tab">
                    <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path>
                    </svg>
                </button>
            </div>
        </div>
    </header>

    <div class="workspace" id="workspace">
        <div class="device-wrapper" id="deviceWrapper">
            <div class="device-container" id="deviceContainer">
                <div class="device-notch" id="deviceNotch"></div>
                <div class="device-screen">
                    <iframe id="previewFrame" src="about:blank"></iframe>
                </div>
            </div>
        </div>
        <div class="res-label" id="resLabel">393 × 852 px</div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const initialUrl = urlParams.get('url') || 'http://localhost:8080';

        const targetUrlInput = document.getElementById('targetUrl');
        const previewFrame = document.getElementById('previewFrame');
        const deviceSelect = document.getElementById('deviceSelect');
        const zoomSelect = document.getElementById('zoomSelect');
        const rotateBtn = document.getElementById('rotateBtn');
        const reloadBtn = document.getElementById('reloadBtn');
        const openTabBtn = document.getElementById('openTabBtn');
        const deviceWrapper = document.getElementById('deviceWrapper');
        const deviceContainer = document.getElementById('deviceContainer');
        const deviceNotch = document.getElementById('deviceNotch');
        const resLabel = document.getElementById('resLabel');
        const workspace = document.getElementById('workspace');

        let isLandscape = false;

        targetUrlInput.value = initialUrl;
        previewFrame.src = initialUrl;

        function updateDeviceDimensions() {
            const [wStr, hStr] = deviceSelect.value.split('x');
            let w = parseInt(wStr, 10);
            let h = parseInt(hStr, 10);

            if (isLandscape) {
                [w, h] = [h, w];
                deviceNotch.style.display = 'none';
            } else {
                deviceNotch.style.display = w >= 600 ? 'none' : 'block';
            }

            const isDesktop = w >= 1000;
            deviceContainer.style.borderRadius = isDesktop ? '16px' : (w >= 600 ? '28px' : '44px');
            deviceContainer.style.width = `${w + 20}px`;
            deviceContainer.style.height = `${h + 20}px`;

            resLabel.textContent = `${w} × ${h} px (${isLandscape ? 'Landscape' : 'Portrait'})`;
            applyZoom(w + 20, h + 20);
        }

        function applyZoom(containerW, containerH) {
            const zoomMode = zoomSelect.value;

            if (zoomMode === 'auto') {
                const availW = workspace.clientWidth - 40;
                const availH = workspace.clientHeight - 40;
                const scaleW = availW / containerW;
                const scaleH = availH / containerH;
                const autoScale = Math.min(1, Math.min(scaleW, scaleH));
                deviceWrapper.style.transform = `scale(${autoScale.toFixed(2)})`;
            } else {
                deviceWrapper.style.transform = `scale(${zoomMode})`;
            }
        }

        deviceSelect.addEventListener('change', updateDeviceDimensions);
        zoomSelect.addEventListener('change', updateDeviceDimensions);
        window.addEventListener('resize', updateDeviceDimensions);

        rotateBtn.addEventListener('click', () => {
            isLandscape = !isLandscape;
            rotateBtn.classList.toggle('active', isLandscape);
            updateDeviceDimensions();
        });

        reloadBtn.addEventListener('click', () => {
            previewFrame.src = targetUrlInput.value;
        });

        openTabBtn.addEventListener('click', () => {
            window.open(targetUrlInput.value, '_blank');
        });

        targetUrlInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                previewFrame.src = targetUrlInput.value;
            }
        });

        updateDeviceDimensions();
    </script>
</body>
</html>
